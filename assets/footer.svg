<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-labelledby="title desc">
  <title id="title">Thanks for visiting</title>
  <desc id="desc">A compact matching dark green footer banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1511"/>
      <stop offset="1" stop-color="#111e17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#90eea6"/>
      <stop offset="1" stop-color="#3cab73"/>
