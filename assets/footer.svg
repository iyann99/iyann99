  </defs>
  <rect width="1200" height="112" rx="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="5" height="112" rx="2.5" fill="url(#accent)"/>
  <path d="M34 86H1166" stroke="#91dca4" stroke-opacity=".16"/>
